<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backstage — diagnóstico</title>
<link rel="stylesheet" href="css/estilo.css">
<style>
  .teste { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--borda); }
  .teste:last-child { border-bottom:none; }
  .marca { width:22px; flex-shrink:0; font-size:16px; text-align:center; line-height:1.4; }
  .teste .nome { font-weight:500; font-size:14px; }
  .teste .obs { font-size:13px; color:var(--texto-2); margin-top:2px; word-break:break-word; }
  .ok { color: var(--verde); }
  .ruim { color: var(--vermelho); }
  .esperando { color: var(--texto-3); }
</style>
</head>
<body>

<div class="conteudo" style="max-width:640px">
  <div class="pagina-topo">
    <h1>Diagnóstico</h1>
  </div>
  <p style="color:var(--texto-2);font-size:14px;margin-bottom:18px">
    Esta página testa cada peça separadamente e diz onde parou.
  </p>

  <div class="cartao" id="lista"></div>

  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
    <button class="botao" onclick="location.reload()">Rodar de novo</button>
    <button class="botao" id="copiar">Copiar resultado</button>
    <a class="botao" href="index.html">Voltar ao sistema</a>
  </div>
</div>

<script type="module">
import { SUPABASE_URL, SUPABASE_CHAVE } from './js/config.js';

const testes = [
  { nome: 'Arquivo de configuração', fn: async () => {
      if (!SUPABASE_URL || !SUPABASE_CHAVE) throw new Error('URL ou chave em branco no js/config.js');
      return SUPABASE_URL;
    }},
  { nome: 'Biblioteca externa (jsDelivr)', fn: async () => {
      const m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
      if (!m.createClient) throw new Error('Biblioteca carregou incompleta');
      return 'carregada';
    }},
  { nome: 'Servidor do banco responde', fn: async () => {
      // Precisa dos dois cabeçalhos: a chave identifica o projeto,
      // a autorização identifica quem está pedindo.
      const r = await fetch(SUPABASE_URL + '/rest/v1/', {
        headers: { apikey: SUPABASE_CHAVE, Authorization: 'Bearer ' + SUPABASE_CHAVE }
      });
      if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
      return 'respondendo (HTTP ' + r.status + ')';
    }},
  { nome: 'Tabelas criadas', fn: async () => {
      const r = await fetch(SUPABASE_URL + '/rest/v1/empresa?select=id&limit=1', {
        headers: { apikey: SUPABASE_CHAVE, Authorization: 'Bearer ' + SUPABASE_CHAVE }
      });
      if (r.status === 404) throw new Error('Tabela "empresa" não existe — o schema não rodou');
      if (!r.ok && r.status !== 401 && r.status !== 403) throw new Error('HTTP ' + r.status);
      return 'tabela empresa encontrada';
    }},
  { nome: 'Sua sessão', fn: async () => {
      const m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
      const bd = m.createClient(SUPABASE_URL, SUPABASE_CHAVE);
      const { data } = await bd.auth.getSession();
      return data.session ? 'conectado como ' + data.session.user.email : 'ninguém conectado (normal antes de entrar)';
    }},
  { nome: 'Depósito de arquivos', fn: async () => {
      const m = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
      const bd = m.createClient(SUPABASE_URL, SUPABASE_CHAVE);
      const { data, error } = await bd.storage.from('logos').list('', { limit: 1 });
      if (error) throw new Error(error.message);
      return 'acessível';
    }},
];

const lista = document.getElementById('lista');
lista.innerHTML = testes.map((t, i) => `
  <div class="teste">
    <div class="marca esperando" id="m${i}">•</div>
    <div style="min-width:0">
      <div class="nome">${t.nome}</div>
      <div class="obs" id="o${i}">aguardando...</div>
    </div>
  </div>`).join('');

const resultados = [];

for (let i = 0; i < testes.length; i++) {
  const marca = document.getElementById('m' + i);
  const obs = document.getElementById('o' + i);
  try {
    const r = await testes[i].fn();
    marca.textContent = '✓'; marca.className = 'marca ok';
    obs.textContent = r;
    resultados.push(`OK   ${testes[i].nome}: ${r}`);
  } catch (e) {
    marca.textContent = '✕'; marca.className = 'marca ruim';
    obs.textContent = e.message;
    obs.style.color = 'var(--vermelho)';
    resultados.push(`FALHA ${testes[i].nome}: ${e.message}`);
  }
}

document.getElementById('copiar').addEventListener('click', e => {
  navigator.clipboard?.writeText(
    'Backstage — diagnóstico\n' + navigator.userAgent + '\n\n' + resultados.join('\n')
  );
  e.target.textContent = 'Copiado';
});
</script>
</body>
</html>
